      - «API Keys» → «Create a new API key»
      - Скопируйте ключ
    check: {url: "", auth: none}

  - id: cloudflare
    name: Cloudflare Workers AI
    env: CLOUDFLARE_API_KEY
    extra_env:
      - env: CLOUDFLARE_ACCOUNT_ID
        prompt: "Account ID (32 символа, справа на главной странице панели Cloudflare)"
        secret: false
    priority: 2
    gives: модели Llama/Qwen, генерация картинок FLUX и SDXL, эмбеддинги
    limits: 10 000 «нейронов» в сутки на весь аккаунт
    needs: только почта
    signup: https://dash.cloudflare.com/sign-up
    key_url: https://dash.cloudflare.com/profile/api-tokens
    steps:
      - Зарегистрируйтесь
      - «Create Token» → шаблон «Workers AI» → «Continue to summary» → «Create Token»
      - Скопируйте токен; Account ID возьмите на главной странице панели (справа внизу)
    check: {url: "https://api.cloudflare.com/client/v4/user/tokens/verify", auth: bearer}

