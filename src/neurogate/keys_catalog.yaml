# Каталог сервисов для `neurogate setup`: где взять ключ, что он даёт, как проверить.
#
# priority: 1 — ставить первыми (быстро, без карты, хорошо кодят)
#           2 — дополнительная ёмкость и модели
#           3 — нишевые или с неудобствами (телефон РФ, верификация, ежедневный чек-ин)
# check:    как проверить ключ без расхода квоты. auth: bearer | query | none.
#           401/403 → ключ неверный; 2xx → принят; остальное → «не удалось проверить».
# Ссылки сверены 2026-10-28. Сервис закрылся или сменил адрес — правь здесь, код не трогай.

# Быстрый старт: бот берёт первый рабочий из этих трёх (остальные — запасные), мастер — все три. Каждого хватает, чтобы работать (вход через Google, без карты,
# без телефона, без региональных блокировок). Мастер и бот идут с них, остальное — по желанию.
quick: [gemini, openrouter, nvidia]

services:
  - id: groq
    name: Groq
    env: GROQ_API_KEY
    priority: 1
    gives: чат и код, очень быстрые ответы, распознавание речи (Whisper)
    limits: 30 запросов/мин, 1–14 тыс. запросов/день на модель
    needs: почта или Google/GitHub; из некоторых стран и через VPN вход отклоняется — тогда пропустите
    signup: https://console.groq.com
    key_url: https://console.groq.com/keys
    steps:
      - Войдите через Google или GitHub
      - Нажмите «Create API Key», назовите neurogate
      - Скопируйте ключ (начинается с gsk_) — он показывается один раз
    check: {url: "https://api.groq.com/openai/v1/models", auth: bearer}

  - id: gemini
    name: Google Gemini (AI Studio)
    env: GEMINI_API_KEY
    priority: 1
    gives: сильный код, длинный контекст (1М токенов), картинки на вход, веб-поиск
    limits: 10 запросов/мин, 250–1500 запросов/день
    needs: Google-аккаунт; из РФ нужен VPN при регистрации
    signup: https://aistudio.google.com
    key_url: https://aistudio.google.com/apikey
    steps:
      - Войдите Google-аккаунтом
      - Нажмите «Create API key» → выберите или создайте проект
      - Скопируйте ключ (начинается с AIza)
    check: {url: "https://generativelanguage.googleapis.com/v1beta/models", auth: query, param: key}

  - id: openrouter
    name: OpenRouter
    env: OPENROUTER_API_KEY
    priority: 1
    gives: десятки бесплатных моделей (:free) — Qwen-Coder, DeepSeek, Nemotron, GLM
    limits: 20 запросов/мин, 50 запросов/день (1000 после разового депозита $10)
    needs: Google/GitHub, карта не нужна
    signup: https://openrouter.ai
    key_url: https://openrouter.ai/keys
    steps:
      - Войдите через Google или GitHub
      - Нажмите «Create Key», лимит кредитов оставьте пустым
      - Скопируйте ключ (начинается с sk-or-)
    check: {url: "https://openrouter.ai/api/v1/key", auth: bearer}

  - id: cerebras
    name: Cerebras
    env: CEREBRAS_API_KEY
    priority: 2
    gives: очень быстрый Qwen-3-235B и gpt-oss, без суточного потолка
    limits: старые аккаунты — 5–30 запросов/мин без лимита в день; новым с 08.2026 — $5 на 30 дней
    needs: телефон; новым аккаунтам — карта
    signup: https://cloud.cerebras.ai
    key_url: https://cloud.cerebras.ai/platform
    steps:
      - Зарегистрируйтесь и подтвердите телефон
      - Слева «API Keys» → «Generate API key»
      - Скопируйте ключ (начинается с csk-)
    check: {url: "https://api.cerebras.ai/v1/models", auth: bearer}

  - id: nvidia
    name: NVIDIA NIM
    env: NVIDIA_API_KEY
    priority: 1
    gives: Qwen3-Coder-480B (лучший бесплатный для кода), DeepSeek, Kimi, без суточного потолка
    limits: 40 запросов/мин, без лимита в день
    needs: только почта
    signup: https://build.nvidia.com
    key_url: https://build.nvidia.com/settings/api-keys
    steps:
      - Зарегистрируйтесь (NVIDIA Developer, бесплатно)
      - «Generate API Key»
      - Скопируйте ключ (начинается с nvapi-)
    check: {url: "", auth: none, prefix: "nvapi-"}

  - id: mistral
    name: Mistral
    env: MISTRAL_API_KEY
    priority: 2
    gives: Mistral Large, Codestral (отдельная квота для кода), эмбеддинги
    limits: около 4 запросов/мин на чат + Codestral 30/мин; на бесплатном плане учится на запросах
